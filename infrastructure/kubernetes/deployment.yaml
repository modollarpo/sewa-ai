# ╔══════════════════════════════════════════════════════════╗
# ║  FEDERATED LEARNING — Flower coordinator (Spot pool)    ║
# ╚══════════════════════════════════════════════════════════╝
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-ai-federated
  namespace: sewa-ai
  labels:
    app: sewa-ai-federated
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-ai-federated
  template:
    metadata:
      labels:
        app: sewa-ai-federated
    spec:
      # Prefer spot nodes for cost saving; fallback to system nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values: [batch-training]
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: sewa-model-cache
      containers:
        - name: ai-federated
          image: ACR_LOGIN_SERVER/sewa-ai/ai-federated:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: sewa-config
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests: { cpu: "2000m", memory: "4Gi" }
            limits:   { cpu: "8000m", memory: "16Gi" }
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sewa-ai-federated
  namespace: sewa-ai
spec:
  selector:
    app: sewa-ai-federated
  ports:
    - port: 8004
      targetPort: 8004

