# ║  WORKLOAD IDENTITY — ServiceAccount for Key Vault access ║
# ╚══════════════════════════════════════════════════════════╝
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sewa-workload-sa
  namespace: sewa-ai
  annotations:
