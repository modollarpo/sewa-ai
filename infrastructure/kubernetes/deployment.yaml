---
# ╔══════════════════════════════════════════════════════════╗
# ║  AUTOSCALING — HPA for backend + KEDA for AI triage     ║
# ╚══════════════════════════════════════════════════════════╝
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sewa-backend-hpa
  namespace: sewa-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sewa-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

---
# KEDA ScaledObject — scale AI triage on Service Bus queue depth
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sewa-triage-scaler
  namespace: sewa-ai
spec:
  scaleTargetRef:
    name: sewa-ai-triage
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: sewa-scan-triage
        messageCount: "5"             # scale up when > 5 messages queued
        namespace: sewa-ai-production-sb
      authenticationRef:
        name: sewa-keda-auth

---
# KEDA TriggerAuthentication — uses workload identity for Service Bus
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: sewa-keda-auth
  namespace: sewa-ai
spec:
  podIdentity:
    provider: azure-workload

---
# ╔══════════════════════════════════════════════════════════╗
# ║  POD DISRUPTION BUDGETS — zero-downtime deploys          ║
# ╚══════════════════════════════════════════════════════════╝
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sewa-backend-pdb
  namespace: sewa-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sewa-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sewa-ai-triage-pdb
  namespace: sewa-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sewa-ai-triage

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sewa-frontend-pdb
  namespace: sewa-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sewa-frontend

---
# ╔══════════════════════════════════════════════════════════╗
# ║  INGRESS — NGINX with TLS, rate limiting, WAF headers   ║
# ╚══════════════════════════════════════════════════════════╝
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sewa-ingress
  namespace: sewa-ai
  annotations:
    kubernetes.io/ingress.class:               "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect:  "true"
    nginx.ingress.kubernetes.io/use-regex:     "true"
    # Rate limiting — 100 req/min per IP for API
    nginx.ingress.kubernetes.io/limit-rps:     "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Content-Security-Policy: default-src 'self'";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # TLS certificate from cert-manager (Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Proxy settings for large DICOM uploads
    nginx.ingress.kubernetes.io/proxy-body-size:         "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout:      "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout:      "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout:   "60"
spec:
  tls:
    - hosts:
        - api.sewaxai.health
        - app.sewaxai.health
      secretName: sewa-tls-cert
  rules:
    - host: api.sewaxai.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sewa-backend
                port:
                  number: 3000
    - host: app.sewaxai.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sewa-frontend
                port:
                  number: 80
