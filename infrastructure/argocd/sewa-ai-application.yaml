# SEWA XAI ArgoCD Application
# GitOps workflow for continuous deployment
# Compliance: Audit trail for all changes, automated rollbacks

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sewa-ai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/modollarpo/sewa-ai.git
    targetRevision: main
    path: azure/k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sewa-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
