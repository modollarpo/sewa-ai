# ArgoCD Project Configuration
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Default project for SEWA XAI
  sourceRepos:
  - '*'
  destinations:
  - namespace: sewa-ai
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  orphanedResources:
    warn: true
