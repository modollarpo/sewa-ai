apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: sewa-ai
spec:
  podSelector:
    matchLabels:
      app: sewa-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 3000
      protocol: TCP
  egress:
  # ── AI service pods (ports must match ai-services-deployment-prod.yaml) ──
  - ports:
    - port: 8000
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-triage
  - ports:
    - port: 8001
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-vlm-report
  - ports:
    - port: 8002
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-pathology
  - ports:
    - port: 8003
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-metacognition
  - ports:
    - port: 8004
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-federated
    - podSelector:
        matchLabels:
          app: sewa-federated-learning
  - ports:
    - port: 8005
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-continuous
  - ports:
    - port: 8007
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-mammography
  - ports:
    - port: 8008
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-retinal
  - ports:
    - port: 8009
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: sewa-uncertainty
  # ── PostgreSQL Flexible Server (VNet-injected, db-subnet 10.10.2.0/24) ──
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.10.2.0/24
  # ── Redis: in-cluster pod OR Azure Cache (redis-subnet 10.10.3.0/24) ──
  - ports:
    - port: 6379
      protocol: TCP
    - port: 6380
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.10.3.0/24
    - podSelector:
        matchLabels:
          app: sewa-redis
  # ── DNS resolution ──
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # ── External HTTPS (Azure APIs, SendGrid, Stripe, etc.) ──
  - ports:
    - port: 443
      protocol: TCP
