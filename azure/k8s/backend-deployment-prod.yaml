apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-backend
  namespace: sewa-ai
  labels:
    app: sewa-backend
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sewa-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sewa-backend
      annotations:
        azure.workload.identity/inject-proxy-sidecar: "true"  # For network isolation
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: backend
        image: "{{CONTAINER_REGISTRY}}/sewa-backend:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        ports:
        - containerPort: 3000

        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: KEY_VAULT_URI
          valueFrom:
            configMapKeyRef:
              name: sewa-config
              key: KEY_VAULT_URI
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-jwt-refresh-secret
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-encryption-key
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-storage-connection-string
        # ── AI Service URLs ────────────────────────────────────────────
        # All ports must match the actual containerPort in ai-services-deployment-prod.yaml
        # triage=8000, vlm=8001, pathology=8002, metacognition=8003,
        # federated=8004, continuous=8005, mammography=8007, retinal=8008, uncertainty=8009
        - name: TRIAGE_URL
          value: "http://sewa-triage:8000"
        - name: AI_SERVICE_URL
          value: "http://sewa-triage:8000"
        - name: VLM_URL
          value: "http://sewa-vlm-report:8001"
        - name: VLM_SERVICE_URL
          value: "http://sewa-vlm-report:8001"
        - name: UNCERTAINTY_URL
          value: "http://sewa-uncertainty:8009"
        - name: UNCERTAINTY_SERVICE_URL
          value: "http://sewa-uncertainty:8009"
        - name: METACOGNITION_URL
          value: "http://sewa-metacognition:8003"
        - name: METACOGNITION_SERVICE_URL
          value: "http://sewa-metacognition:8003"
        - name: FL_SERVICE_URL
          value: "http://sewa-federated:8004"
        - name: CL_SERVICE_URL
          value: "http://sewa-continuous:8005"
        - name: PATHOLOGY_SERVICE_URL
          value: "http://sewa-pathology:8002"
        - name: MAMMOGRAPHY_SERVICE_URL
          value: "http://sewa-mammography:8007"
        - name: RETINAL_SERVICE_URL
          value: "http://sewa-retinal:8008"
        - name: AZURE_STORAGE_CONTAINER
          value: "scans"
        - name: FHIR_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-fhir-tenant-id
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sewa-backend
  namespace: sewa-ai
spec:
  selector:
    app: sewa-backend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sewa-backend-ingress
  namespace: sewa-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.production.sewaxai.health
    secretName: sewa-tls-production
  rules:
  - host: api.production.sewaxai.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-backend
            port:
              number: 80
