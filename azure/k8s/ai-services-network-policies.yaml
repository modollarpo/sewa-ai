---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pathology-policy
  namespace: sewa-ai
spec:
  podSelector:
    matchLabels:
      app: sewa-pathology
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: sewa-backend
    ports:
    - port: 8002
      protocol: TCP
