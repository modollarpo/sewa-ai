# ── Continuous Learning Service ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-continuous
  namespace: sewa-ai
      serviceAccountName: sewa-ai-sa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-continuous
  template:
    metadata:
      labels:
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
        env:
        - name: KEY_VAULT_URI
          valueFrom:
            configMapKeyRef:
              name: sewa-config
              key: KEY_VAULT_URI
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-storage-connection-string
      - name: acr-secret
      containers:
      - name: continuous
        image: "{{CONTAINER_REGISTRY}}/sewa-continuous:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        envFrom:
        - secretRef:
            name: sewa-secrets
        - configMapRef:
            name: sewa-config
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "sewa-azure-kv"
          nodePublishSecretRef:
            name: secrets-store-creds
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-continuous
  namespace: sewa-ai
spec:
  selector:
    app: sewa-continuous
  ports:
  - port: 8005
    targetPort: 8005
      serviceAccountName: sewa-ai-sa
---
