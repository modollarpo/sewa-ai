apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-federated
  namespace: sewa-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-federated
  template:
    metadata:
      labels:
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
        env:
        - name: KEY_VAULT_URI
          valueFrom:
            configMapKeyRef:
              name: sewa-config
              key: KEY_VAULT_URI
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-storage-connection-string
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "sewa-azure-kv"
          nodePublishSecretRef:
            name: secrets-store-creds
            memory: "4Gi"
          requests:
            memory: "1Gi"
            cpu: "500m"
