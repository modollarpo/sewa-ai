apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    azure.workload.identity/client-id: "${AI_SERVICES_WORKLOAD_IDENTITY_CLIENT_ID}"
  name: sewa-ai-sa
  namespace: sewa-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-triage
  namespace: sewa-ai
  labels:
    app: sewa-triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sewa-triage
  template:
    metadata:
      labels:
        app: sewa-triage
    spec:
      serviceAccountName: sewa-ai-sa
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: triage
        image: "{{CONTAINER_REGISTRY}}/sewa-triage:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "6Gi"
          requests:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
        env:
        - name: KEY_VAULT_URI
          valueFrom:
            configMapKeyRef:
              name: sewa-config
              key: KEY_VAULT_URI
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-storage-connection-string
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "sewa-azure-kv"
          nodePublishSecretRef:
            name: secrets-store-creds
spec:
  selector:
    app: sewa-triage
  ports:
  - port: 8000
    targetPort: 8000
---
