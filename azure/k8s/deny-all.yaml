apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: sewa-ai
spec:
  # Default-deny all ingress and egress for pods not covered by other policies.
  # Individual service policies (backend-policy, triage-policy, etc.) explicitly
  # whitelist the traffic they need.
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
