# SEWA XAI — Production Ingress
# Requires: nginx ingress controller + cert-manager with letsencrypt-prod ClusterIssuer
# Applied by deploy-azure-acr.sh
# © 2026 SEWA XAI — a Storegrill Inc Ltd company. Registered in England & Wales (14581073).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sewa-api-ingress
  namespace: sewa-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.sewaxai.health
    - sewa-ai-api.uksouth.cloudapp.azure.com
    secretName: sewa-api-tls
  rules:
  - host: api.sewaxai.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-backend
            port:
              number: 80
  - host: sewa-ai-api.uksouth.cloudapp.azure.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-backend
            port:
              number: 80
