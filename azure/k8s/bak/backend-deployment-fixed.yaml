# SEWA XAI — Backend API Deployment (Fixed for production)
# Image: ACR latest, production ENV, no Ingress placeholders/secrets dependency

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-backend
  namespace: sewa-ai
  labels:
    app: sewa-backend
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sewa-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sewa-backend
    spec:
      containers:
      - name: backend
        image: sewaaieuprodacr.azurecr.io/sewa-backend:fix-payment-init-4
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: sewa-secrets
        env:
        - name: DEPLOY_TARGET
          value: azure
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        - name: TRIAGE_URL
          value: "http://sewa-triage:8000"
        - name: VLM_URL
          value: "http://sewa-vlm-report:8001"
        - name: UNCERTAINTY_URL
          value: "http://sewa-uncertainty:8002"
        - name: METACOGNITION_URL
          value: "http://sewa-metacognition:8003"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-backend
  namespace: sewa-ai
spec:
  selector:
    app: sewa-backend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
