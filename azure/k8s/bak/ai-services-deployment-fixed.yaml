apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-federated-learning
  namespace: sewa-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-federated-learning
  template:
    metadata:
      labels:
        app: sewa-federated-learning
    spec:
      containers:
      - name: federated-learning
        image: sewaaiproductionacr.azurecr.io/sewa-federated-learning:latest
        ports:
        - containerPort: 8004
        env:
        - name: FL_SERVER_PORT
          value: "8080"
        resources:
          limits:
            memory: 4Gi
          requests:
            memory: 1Gi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-federated-learning
  namespace: sewa-ai
spec:
  selector:
    app: sewa-federated-learning
  ports:
  - name: http
    port: 8004
    targetPort: 8004
  - name: flower
    port: 8080
    targetPort: 8080

