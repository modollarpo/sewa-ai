# SEWA XAI — AI Services Production Deployment (Fixed YAML)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-triage
  namespace: sewa-ai
  labels:
    app: sewa-triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sewa-triage
  template:
    metadata:
      labels:
        app: sewa-triage
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: triage
        image: sewaaiproductionacr.azurecr.io/sewa-triage:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 6Gi
          requests:
            memory: 2Gi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-triage
  namespace: sewa-ai
spec:
  selector:
    app: sewa-triage
  ports:
  - port: 8000
    targetPort: 8000
---
