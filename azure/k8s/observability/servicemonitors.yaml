# Prometheus ServiceMonitors for SEWA AI Services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sewa-backend-monitor
  namespace: sewa-ai
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: sewa-backend
  endpoints:
  - port: http  # Assuming service port name is "http"
    path: /metrics
    interval: 30s
---
