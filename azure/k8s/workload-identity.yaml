# SEWA XAI Workload Identity & Secrets Store CSI Driver Setup
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    azure.workload.identity/client-id: "33e84b8c-6e89-4ea2-8473-f1e037710c4c"
  name: sewa-backend-sa
  namespace: sewa-ai
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sewa-azure-kv
  namespace: sewa-ai
spec:
  provider: azure
  secretObjects:
  - data:
    - key: sewa-database-url
      objectName: sewa-database-url
    - key: sewa-redis-url
      objectName: sewa-redis-url
    - key: sewa-jwt-secret
      objectName: sewa-jwt-secret
    - key: sewa-jwt-refresh-secret
      objectName: sewa-jwt-refresh-secret
    - key: sewa-encryption-key
      objectName: sewa-encryption-key
    - key: sewa-storage-connection-string
      objectName: sewa-storage-connection-string
    - key: sewa-fhir-tenant-id
      objectName: sewa-fhir-tenant-id
    - key: sewa-openai-api-key
      objectName: sewa-openai-api-key
    - key: sewa-speech-key
      objectName: sewa-speech-key
    - key: sewa-appinsights-connection-string
      objectName: sewa-appinsights-connection-string
    secretName: sewa-secrets-store
    type: Opaque
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "33e84b8c-6e89-4ea2-8473-f1e037710c4c"
    keyvaultName: "sewa-ai-prod-eu-kv"
    tenantId: "96cb1af7-f1d4-4a65-ab32-2d641c985725"
    objects: |
      array:
        - |
          objectName: sewa-database-url
          objectType: secret
        - |
          objectName: sewa-redis-url
          objectType: secret
        - |
          objectName: sewa-jwt-secret
          objectType: secret
        - |
          objectName: sewa-jwt-refresh-secret
          objectType: secret
        - |
          objectName: sewa-encryption-key
          objectType: secret
        - |
          objectName: sewa-storage-connection-string
          objectType: secret
        - |
          objectName: sewa-fhir-tenant-id
          objectType: secret
        - |
          objectName: sewa-openai-api-key
          objectType: secret
        - |
          objectName: sewa-speech-key
          objectType: secret
        - |
          objectName: sewa-appinsights-connection-string
          objectType: secret
