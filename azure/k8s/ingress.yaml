apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sewa-ingress
  namespace: sewa-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-prod # or self-signed for test
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.sewaxai.health
    secretName: sewa-tls
  rules:
  - host: api.sewaxai.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-backend
            port:
              number: 80
