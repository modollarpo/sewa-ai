# SEWA AI — ACR image pull secret
# Created by deploy-azure-acr.sh automatically.
# This manifest documents the structure; the secret is created
# imperatively by the script via: az acr credential show + kubectl create secret
# © 2026 SEWA AI — a Storegrill Inc Ltd company. Registered in England & Wales (14581073).
#
# The AKS cluster uses kubelet managed identity (AcrPull role assigned by Terraform),
# so explicit imagePullSecrets are a belt-and-braces fallback.
# If AKS workload identity is correctly configured, image pulls work without this secret.
apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: sewa-ai
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: PLACEHOLDER_SET_BY_DEPLOY_SCRIPT
