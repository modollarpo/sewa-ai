apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-frontend
  namespace: sewa-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sewa-frontend
  template:
    metadata:
      labels:
        app: sewa-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: acr-secret
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: frontend
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        image: "sewaaieuprodacr.azurecr.io/sewa-frontend:main-c61bf1a9"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-frontend
  namespace: sewa-ai
spec:
  selector:
    app: sewa-frontend
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sewa-frontend-ingress
  namespace: sewa-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - sewaxai.health
    - www.sewaxai.health
    - app.sewaxai.health
    secretName: sewa-tls-frontend
  - hosts:
    - "*.sewaxai.health"
    secretName: sewa-tls-wildcard
  rules:
  - host: sewaxai.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-frontend
            port:
              number: 80
  - host: www.sewaxai.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-frontend
            port:
              number: 80
  - host: app.sewaxai.health
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-frontend
            port:
              number: 80
  - host: "*.sewaxai.health"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sewa-frontend
            port:
              number: 80

