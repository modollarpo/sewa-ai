apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-frontend
  namespace: sewa-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sewa-frontend
  template:
    metadata:
      labels:
        app: sewa-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: frontend
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        image: "{{CONTAINER_REGISTRY}}/sewa-frontend:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-frontend
  namespace: sewa-ai
spec:
  selector:
    app: sewa-frontend
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP

