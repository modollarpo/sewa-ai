# SEWA XAI — Pod Disruption Budgets
# Ensures rolling updates and node drain never takes all replicas offline.
# Clinical SLA: at least 1 AI inference pod MUST remain running at all times.
---
# Triage — primary AI pathway (min 1 always available)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sewa-triage-pdb
  namespace: sewa-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sewa-triage
---
# Uncertainty — clinical safety gate (min 1 always available)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sewa-uncertainty-pdb
  namespace: sewa-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sewa-uncertainty
---
# VLM Report — report generation (min 1 always available)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sewa-vlm-pdb
  namespace: sewa-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sewa-vlm-report
---
# Metacognition (min 1 always available)
apiVersion: policy/v1
