apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation
  namespace: sewa-ai
  labels:
    app: translation
    tier: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translation
  template:
    metadata:
      labels:
        app: translation
        tier: ai-service
    spec:
      containers:
      - name: translation
        image: libretranslate/libretranslate:latest
        ports:
        - containerPort: 5000
        env:
        - name: LT_API_KEY
          value: "free"
        - name: LT_LOAD_ONLY
          value: "en,fr,ar,sw,de,es,pt,it"
        - name: LT_UPDATE_MODELS
          value: "false"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: translation
  namespace: sewa-ai
spec:
  selector:
    app: translation
  ports:
  - port: 8080
    targetPort: 5000
    name: http
  type: ClusterIP
