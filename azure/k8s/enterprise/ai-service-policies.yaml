apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-transcription-policy
  namespace: sewa-ai
spec:
  podSelector:
    matchLabels:
      app: voice-transcription
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: sewa-backend
    ports:
    - port: 8000
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: translation
    ports:
    - port: 5000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: translation-policy
  namespace: sewa-ai
spec:
  podSelector:
    matchLabels:
      app: translation
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: voice-transcription
    ports:
    - port: 5000
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: sewa-backend
    ports:
    - port: 5000
      protocol: TCP
