apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-transcription
  namespace: sewa-ai
  labels:
    app: voice-transcription
    tier: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-transcription
  template:
    metadata:
      labels:
        app: voice-transcription
        tier: ai-service
    spec:
      containers:
      - name: voice-transcription
        image: sewaaiproductionacr.azurecr.io/sewa-voice-transcription:prod-20260723
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: MODEL
          value: "base"
        - name: BACKEND
          value: "openai"
        - name: AZURE_SPEECH_KEY
          valueFrom:
            secretKeyRef:
              name: sewa-secrets-store
              key: sewa-speech-key
        - name: AZURE_SPEECH_REGION
          value: "uksouth"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: voice-transcription
  namespace: sewa-ai
spec:
  selector:
    app: voice-transcription
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
