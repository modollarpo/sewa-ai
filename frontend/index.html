<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>SEWA AI — Clinical Intelligence Platform</title>
  <meta name="description" content="AI-powered medical imaging triage and reporting. Detect ICH, PE, stroke and 14 conditions in under 2 seconds. NHS-certified. Deployed across UK, EU, and Africa." />
  <meta name="keywords" content="clinical AI, radiology AI, medical imaging, NHS, ICH detection, stroke alert, SEWA AI" />
  <meta name="author" content="Storegrill Inc Ltd" />
  <meta name="robots" content="index, follow" />

  <!-- Theme -->
  <meta name="theme-color" content="#408D7B" />
  <meta name="msapplication-TileColor" content="#050F0C" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo-master.svg" />
  <link rel="icon" type="image/svg+xml" href="/logo-master.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SEWA AI — From Hours to Seconds" />
  <meta property="og:description" content="Autonomous AI diagnostic intelligence for NHS hospitals and African clinics. 1.84 second door-to-alert." />
  <meta property="og:image" content="https://sewaxai.health/og-image.png" />
  <meta property="og:url" content="https://sewaxai.health" />
  <meta property="og:site_name" content="SEWA AI" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SEWA AI — Clinical Intelligence Platform" />
  <meta name="twitter:description" content="AI-powered medical imaging triage in under 2 seconds. NHS-certified." />
  <meta name="twitter:image" content="https://sewaxai.health/og-image.png" />

  <!-- DNS Prefetch -->
  <link rel="dns-prefetch" href="//api.sewaxai.health" />
  <link rel="preconnect" href="https://api.sewaxai.health" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;700&display=swap"
    crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;700&display=swap" />
  </noscript>

  <!-- Structured Data (Schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "SEWA AI",
    "description": "AI-powered clinical diagnostic intelligence platform",
    "url": "https://sewaxai.health",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Web, iOS, Android",
    "offers": { "@type": "Offer", "price": "499", "priceCurrency": "GBP" },
    "author": {
      "@type": "Organization",
      "name": "Storegrill Inc Ltd",
      "url": "https://sewaxai.health",
      "address": { "@type": "PostalAddress", "addressLocality": "Coventry", "addressCountry": "GB" }
    },
    "medicalSpecialty": ["Radiology", "Neurology", "Cardiology", "Pulmonology"]
  }
  </script>

  <!-- Critical CSS -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;padding:0;background:#050F0C;color:#D0ECE6;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh;display:flex;flex-direction:column}
    /* Loading spinner */
    .sewa-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050F0C;z-index:9999;flex-direction:column;gap:16px;transition:opacity .3s}
    .sewa-splash.hidden{opacity:0;pointer-events:none}
    .sewa-ring{width:40px;height:40px;border:3px solid #1B3028;border-top-color:#408D7B;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sewa-splash-logo{font-size:20px;font-weight:900;color:#408D7B;letter-spacing:-0.02em}
  </style>
</head>
<body>
  <!-- Loading splash (hidden once React mounts) -->
  <div class="sewa-splash" id="splash">
    <div class="sewa-ring"></div>
    <div class="sewa-splash-logo">SEWA AI</div>
  </div>

  <div id="root"></div>

  <!-- Register service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('[SEWA] SW registered:', reg.scope))
          .catch(err => console.warn('[SEWA] SW registration failed:', err));
      });
    }
    // Hide splash once React mounts
    window.__sewa_hide_splash = function() {
      var el = document.getElementById('splash');
      if (el) { el.classList.add('hidden'); setTimeout(function(){el.remove()},400); }
    };
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
