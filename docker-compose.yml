# SEWA XAI docker-compose.yml
# Full local development stack
# Usage: docker-compose up -d

version: '3.9'

networks:
  sewa-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  model-cache:
  # Enterprise volumes
  translation-models:
  translation-cache:
  medical-vocab:
  voice-models:
  voice-logs:
  elasticsearch-data:
  grafana-data:
  prometheus-enterprise-data:
  redis-cluster-data:

# ── Infrastructure ───────────────────────────────────────────

postgres:
  image: postgres:15-alpine
  restart: unless-stopped
  networks: [sewa-net]
  environment:
    POSTGRES_DB:       sewa_ai
    POSTGRES_USER:     sewa
    POSTGRES_PASSWORD: sewa_dev_password_change_in_prod
    # HAPI FHIR also needs its own database (created by init script below)
  volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
  ports:
    - "5432:5432"
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "sewa", "-d", "sewa_ai"]
    interval: 10s
    retries: 5

redis:
  image: redis:7-alpine
  restart: unless-stopped
  networks: [sewa-net]
  command: redis-server --appendonly yes --requirepass sewa_redis_dev
  volumes:
    - redis-data:/data
  ports:
    - "6379:6379"
  healthcheck:
    test: ["CMD", "redis-cli", "-a", "sewa_redis_dev", "ping"]
    interval: 10s
    retries: 5

# ── Backend ──────────────────────────────────────────────────

backend:
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "3000:3000"
  environment:
    NODE_ENV:             development
    PORT:                 3000
    DATABASE_URL:         postgresql://sewa:sewa_dev_password_change_in_prod@postgres:5432/sewa_ai
    REDIS_URL:            redis://:sewa_redis_dev@redis:6379
    JWT_SECRET:           dev-jwt-secret-change-in-production-32chars
    JWT_REFRESH_SECRET:   dev-refresh-secret-change-in-prod-32chars
    ENCRYPTION_KEY:       dev-encrypt-key-32-chars-exactly-!!
    AI_SERVICE_URL:       http://ai-triage:8000
    TRIAGE_URL:           http://ai-triage:8000
    VLM_URL:              http://ai-vlm:8001
    UNCERTAINTY_URL:      http://ai-uncertainty:8009
    METACOGNITION_URL:    http://ai-metacognition:8003
    PATHOLOGY_SERVICE_URL: http://ai-pathology:8002
    MAMMOGRAPHY_SERVICE_URL: http://ai-mammography:8007
    RETINAL_SERVICE_URL:   http://ai-retinal:8008
    FL_SERVICE_URL:       http://ai-federated:8004
    CL_SERVICE_URL:       http://ai-continuous:8005
    # Email (mailhog in dev)
    SENDGRID_API_KEY:     ""
    SMTP_HOST:            mailhog
    SMTP_PORT:            "1025"
    EMAIL_FROM:           info@sewaxai.health
    # FCM (leave blank in dev)
    FCM_SERVER_KEY:       ""
    # Twilio (leave blank in dev)
    TWILIO_ACCOUNT_SID:   ""
    TWILIO_AUTH_TOKEN:    ""
    TWILIO_FROM_NUMBER:   +15017122661
    # Storage (Azurite emulator in dev)
    AZURE_STORAGE_CONNECTION_STRING: "UseDevelopmentStorage=true"
    AZURE_STORAGE_CONTAINER: scans
    AI_UNCERTAINTY_URL:   http://ai-uncertainty:8009
    AI_METACOGNITION_URL: http://ai-metacognition:8003
    AI_VLM_URL:           http://ai-vlm:8001
    CORS_ORIGINS:         http://localhost:5173,http://localhost:3001
    SEED_ADMIN_PASSWORD:  dev-seed-admin-password
    LOG_LEVEL:            debug
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  command: >
    sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"
  develop:
    watch:
      - action: sync+restart
        path: ./backend/src
        target: /app/src

# ── Frontend ─────────────────────────────────────────────────

frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile
    args:
      VITE_API_URL: https://api.sewaxai.health/api/v1
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "5173:80"
  depends_on:
    - backend

# ── Enterprise Grade Voice Transcription Service (LibreFree Open Source)
voice-transcription:
  image: shahadathhs/voice-to-text:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8006:8000"
  environment:
    # Enterprise configuration for medical transcription
    MODEL: base            # Cost-effective: Whisper base model
    BACKEND: openai        # OpenAI Whisper API for quality
    MAX_FILE_SIZE: 52428800   # 50MB max audio
    ALLOWED_FORMATS: wav,mp3,ogg,m4a,flac,aac
    # Medical transcription optimization
    LANGUAGE: en           # Default transcription language
    # Production hardening
    WORKER_PROCESSES: 2
    TIMEOUT: 300
    # Security
    FIREWALL_ENABLE: "true"
  volumes:
    - ./voice-models:/models          # Persistent models cache
    - ./voice-logs:/app/logs          # Application logs
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    start_period: 30s
    retries: 3

# ── Enterprise Grade Translation Service (LibreFree Open Source)
translation:
  image: libretranslate/libretranslate:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8082:8080"
  environment:
    # Enterprise configuration for medical translation
    LT_API_KEY: free           # Free tier
    MODEL_CACHE_SIZE: 10Gi   # Large cache for medical terminology
    # Medical domain optimization
    MEDICAL_VOCABULARY: /app/medical-vocab
    # Security and performance
    REDIS_URL: redis://redis:6379
    WORKER_PROCESSES: 4
    TIMEOUT: 300
    # Production hardening
    NGINX_WORKER_PROCESSES: auto
  volumes:
    - ./translation-models:/app/models       # Persistent models
    - ./medical-vocab:/app/medical-vocab     # Medical terminology
    - ./translation-logs:/app/logs          # Application logs
    - translation-cache:/root/.cache/litellm  # LiteLLM cache
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 3G
      reservations:
        cpus: '0.5'
        memory: 512M
    # Enterprise deployment strategies
    update_config:
      order: start-first
      monitor: 30s
      failure_action: rollback
      max_unavailable: 1
      max_out_of_service: 0
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 15s
    start_period: 60s
    retries: 3

# ── Nginx Reverse Proxy (local dev) ────────────────────────
nginx:
  image: nginx:alpine
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "80:80"
  volumes:
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  depends_on:
    - backend
    - frontend
    - translation
    - voice-transcription
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost/health"]
    interval: 30s
    retries: 3

# ── AI Services ──────────────────────────────────────────────

ai-triage:
  build:
    context: ./ai-services/triage
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8000:8000"
  volumes:
    - model-cache:/models
  environment:
    MODEL_CACHE:         /models
    MODEL_VERSION:       v2.4.1
    VCPU_COUNT:          "4"
    MAX_BATCH_SIZE:      "2"
    MAX_BATCH_WAIT_MS:   "50"
    OMP_NUM_THREADS:     "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS:     "1"
    AZURE_STORAGE_URL:   ""
    ALLOWED_ORIGINS:     "http://localhost:3000,http://localhost:5000,http://localhost:5173"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    start_period: 90s
    retries: 3

ai-vlm:
  build:
    context: ./ai-services/vlm-report
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8001:8001"
  environment:
    AZURE_OPENAI_DEPLOYMENT: "gpt-54-mini"
    ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5000,http://localhost:5173"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
