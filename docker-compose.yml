# ── Edge Services ─────────────────────────────────────────────

edge:
  build:
    context: ./edge
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8080:8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    start_period: 15s
    retries: 3

dicom-ingestion-go:
  build:
    context: ./services/dicom-ingestion-go
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "11112:11112"
    - "8090:8090"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
    interval: 30s
    timeout: 10s
    start_period: 10s
    retries: 3

# ── FHIR Validator (HAPI FHIR Validator — local dev only) ─────
# Access: http://localhost:8081  |  Validate: POST http://localhost:8081/validate
fhir-validator:
  image: hapiproject/hapi-fhir-validator-cli:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8081:8080"
  command: ["-p", "8080"]
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
    interval: 30s
    timeout: 10s
    start_period: 30s
    retries: 3

# ── Observability ────────────────────────────────────────────

prometheus:
  image: prom/prometheus:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "9090:9090"
  volumes:
    - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.retention.time=7d'

grafana:
  image: grafana/grafana:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "3001:3000"
  environment:
    GF_SECURITY_ADMIN_PASSWORD: sewa_grafana_dev
    GF_USERS_ALLOW_SIGN_UP:     "false"

# ── FHIR Server (HAPI FHIR JPA — local dev only) ─────────────
# Production uses Azure Health Data Services (no local server needed)
# Access: http://localhost:8080/fhir  |  UI: http://localhost:8080
fhir-server:
  image: hapiproject/hapi:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "8080:8080"
  environment:
    hapi.fhir.default_encoding: json
    hapi.fhir.fhir_version: R4
    hapi.fhir.allow_external_references: "true"
    hapi.fhir.allow_multiple_delete: "true"
    spring.datasource.url: "jdbc:postgresql://postgres:5432/hapi_fhir"
    spring.datasource.username: sewa
    spring.datasource.password: sewa_dev_password_change_in_prod
    spring.datasource.driverClassName: org.postgresql.Driver
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/fhir/metadata"]
    interval: 30s
    timeout: 20s
    start_period: 90s
    retries: 5

# ── Email Testing (dev only) ──────────────────────────────────
mailhog:
  image: mailhog/mailhog:latest
  restart: unless-stopped
  networks: [sewa-net]
  ports:
    - "1025:1025"   # SMTP
    - "8025:8025"   # Web UI