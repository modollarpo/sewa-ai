# SEWA XAI — docker-compose.yml
# Full local development stack
# Usage: docker-compose up -d

version: '3.9'

networks:
  sewa-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  model-cache:

services:
  # ── Infrastructure ───────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks: [sewa-net]
    environment:
      POSTGRES_DB:       sewa_ai
      POSTGRES_USER:     sewa
      POSTGRES_PASSWORD: sewa_dev_password_change_in_prod
      # HAPI FHIR also needs its own database (created by init script below)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sewa", "-d", "sewa_ai"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [sewa-net]
    command: redis-server --appendonly yes --requirepass sewa_redis_dev
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sewa_redis_dev", "ping"]
      interval: 10s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:             development
      PORT:                 3000
      DATABASE_URL:         postgresql://sewa:sewa_dev_password_change_in_prod@postgres:5432/sewa_ai
      REDIS_URL:            redis://:sewa_redis_dev@redis:6379
      JWT_SECRET:           dev-jwt-secret-change-in-production-32chars
      JWT_REFRESH_SECRET:   dev-refresh-secret-change-in-prod-32chars
      ENCRYPTION_KEY:       dev-encrypt-key-32-chars-exactly-!!
      AI_SERVICE_URL:       http://ai-triage:8000
      TRIAGE_URL:           http://ai-triage:8000
      VLM_URL:              http://ai-vlm:8001
      UNCERTAINTY_URL:      http://ai-uncertainty:8009
      METACOGNITION_URL:    http://ai-metacognition:8003
      PATHOLOGY_SERVICE_URL: http://ai-pathology:8002
      MAMMOGRAPHY_SERVICE_URL: http://ai-mammography:8007
      RETINAL_SERVICE_URL:   http://ai-retinal:8008
      FL_SERVICE_URL:       http://ai-federated:8004
      CL_SERVICE_URL:       http://ai-continuous:8005
      # Email (mailhog in dev)
      SENDGRID_API_KEY:     ""
      SMTP_HOST:            mailhog
      SMTP_PORT:            "1025"
      EMAIL_FROM:           info@sewaxai.health
      # FCM (leave blank in dev)
      FCM_SERVER_KEY:       ""
      # Twilio (leave blank in dev)
      TWILIO_ACCOUNT_SID:   ""
      TWILIO_AUTH_TOKEN:    ""
      TWILIO_FROM_NUMBER:   +15017122661
      # Storage (Azurite emulator in dev)
      AZURE_STORAGE_CONNECTION_STRING: "UseDevelopmentStorage=true"
      AZURE_STORAGE_CONTAINER: scans
      AI_UNCERTAINTY_URL:   http://ai-uncertainty:8009
      AI_METACOGNITION_URL: http://ai-metacognition:8003
      AI_VLM_URL:           http://ai-vlm:8001
      CORS_ORIGINS:         http://localhost:5173,http://localhost:3001
      LOG_LEVEL:            debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src

  # ── Frontend ─────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.sewaxai.health/api/v1
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── AI Services ──────────────────────────────────────────────

  ai-triage:
    build:
      context: ./ai-services/triage
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE:         /models
      MODEL_VERSION:       v2.4.1
      VCPU_COUNT:          "4"            # conservative for dev; 8 in prod
      MAX_BATCH_SIZE:      "2"
      MAX_BATCH_WAIT_MS:   "50"
      OMP_NUM_THREADS:     "1"            # prevent BLAS stealing ORT threads
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS:     "1"
      AZURE_STORAGE_URL:   ""
      ALLOWED_ORIGINS:     "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    # CPU-only — no GPU reservation needed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s    # allow time for ONNX model load + warmup
      retries: 3

  ai-vlm:
    build:
      context: ./ai-services/vlm-report
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8001:8001"
    environment:
      AZURE_OPENAI_ENDPOINT: ""          # set to enable Azure OpenAI; blank = template mode
      AZURE_OPENAI_KEY:      ""
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  ai-uncertainty:
    build:
      context: ./ai-services/uncertainty
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8009:8009"
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE:          /models
      MODEL_VERSION:        v2.4.1
      MC_DROPOUT_PASSES:    "10"
      MC_NOISE_STD:         "0.05"
      VCPU_COUNT:           "4"
      OMP_NUM_THREADS:      "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS:      "1"
      AZURE_STORAGE_URL:    ""
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  ai-pathology:
    build:
      context: ./ai-services/pathology
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8002:8002"
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE:         /models
      MODEL_VERSION:       v1.0.0
      VCPU_COUNT:          "4"
      MAX_BATCH_SIZE:      "2"
      MAX_BATCH_WAIT_MS:   "50"
      OMP_NUM_THREADS:     "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS:     "1"
      AZURE_STORAGE_URL:   ""
      ALLOWED_ORIGINS:     "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  ai-mammography:
    build:
      context: ./ai-services/mammography
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8007:8007"
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE:         /models
      MODEL_VERSION:       v1.0.0
      VCPU_COUNT:          "4"
      MAX_BATCH_SIZE:      "2"
      MAX_BATCH_WAIT_MS:   "50"
      OMP_NUM_THREADS:     "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS:     "1"
      AZURE_STORAGE_URL:   ""
      ALLOWED_ORIGINS:     "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  ai-retinal:
    build:
      context: ./ai-services/retinal
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8008:8008"
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE:         /models
      MODEL_VERSION:       v1.0.0
      VCPU_COUNT:          "4"
      MAX_BATCH_SIZE:      "2"
      MAX_BATCH_WAIT_MS:   "50"
      OMP_NUM_THREADS:     "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS:     "1"
      AZURE_STORAGE_URL:   ""
      ALLOWED_ORIGINS:     "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE:          /models
      MODEL_VERSION:        v2.4.1
      MC_DROPOUT_PASSES:    "10"
      MC_NOISE_STD:         "0.05"
      VCPU_COUNT:           "4"
      OMP_NUM_THREADS:      "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS:      "1"
      AZURE_STORAGE_URL:    ""
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  ai-metacognition:
    build:
      context: ./ai-services/metacognition
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8003:8003"
    environment:
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5000,http://localhost:5173"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  ai-federated:
    build:
      context: ./ai-services/federated-learning
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8004:8004"
    volumes:
      - model-cache:/models
    environment:
      MODEL_CACHE_DIR: /models
      FL_ROUNDS: "3"
      FL_MIN_CLIENTS: "2"

  ai-continuous:
    build:
      context: ./ai-services/continuous-learning
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://sewa:sewa_dev_password_change_in_prod@postgres:5432/sewa_ai
      DRIFT_THRESHOLD: "0.15"
      KAPPA_THRESHOLD: "0.75"
    depends_on:
      - postgres

  # ── FHIR Validator (HAPI FHIR Validator — local dev only) ─────
  # Access: http://localhost:8081  |  Validate: POST http://localhost:8081/validate
  fhir-validator:
    image: hapiproject/hapi-fhir-validator-cli:latest
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8081:8080"
    command: ["-p", "8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Observability ────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sewa_grafana_dev
      GF_USERS_ALLOW_SIGN_UP:     "false"


  # ── FHIR Server (HAPI FHIR JPA — local dev only) ─────────────
  # Production uses Azure Health Data Services (no local server needed)
  # Access: http://localhost:8080/fhir  |  UI: http://localhost:8080
  fhir-server:
    image: hapiproject/hapi:latest
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.default_encoding: json
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
      spring.datasource.url: "jdbc:postgresql://postgres:5432/hapi_fhir"
      spring.datasource.username: sewa
      spring.datasource.password: sewa_dev_password_change_in_prod
      spring.datasource.driverClassName: org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 20s
      start_period: 90s
      retries: 5

  # ── Email Testing (dev only) ──────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ── Nginx Reverse Proxy (local dev) ─────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks: [sewa-net]
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      retries: 3
