name: SEWA AI — CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  REGISTRY: sewaaiproductionacr.azurecr.io    # override per cloud in job env
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
# ─────────────────────────────────────────────
# 0. SECRET SCAN (TruffleHog)
# ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: TruffleHog Secret Scan (Push)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --debug --only-verified
        if: github.event_name == 'push'
      - name: TruffleHog Secret Scan (PR)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        if: github.event_name == 'pull_request'

# ─────────────────────────────────────────────
# 1. BACKEND TESTS
# ─────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: sewa, POSTGRES_PASSWORD: test, POSTGRES_DB: sewa_test }
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: yarn, cache-dependency-path: backend/yarn.lock }
      - run: cd backend && yarn install --frozen-lockfile
      - run: cd backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://sewa:test@localhost:5432/sewa_test
      - run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sewa:test@localhost:5432/sewa_test
      - run: cd backend && yarn test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://sewa:test@localhost:5432/sewa_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_32_characters_long!!
          JWT_REFRESH_SECRET: test_refresh_32_characters_long!!
          ENCRYPTION_KEY: test_encryption_key_32_bytes_!!!
          AI_SERVICE_URL: http://localhost:8000
          VLM_SERVICE_URL: http://localhost:8001
          UNCERTAINTY_SERVICE_URL: http://localhost:8002
          METACOGNITION_SERVICE_URL: http://localhost:8003
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

# ─────────────────────────────────────────────
# 2. FRONTEND BUILD
# ─────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.sewaxai.health/v1' }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://api.sewaxai.health' }}
          VITE_APP_ENV: production
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist/ }

# ─────────────────────────────────────────────
# 3. AI SERVICE TESTS (Python)
# ─────────────────────────────────────────────
  test-ai-services:
    name: AI Services Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [triage, vlm-report, uncertainty, metacognition, mammography, retinal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - run: |
          cd ai-services/${{ matrix.service }}
          pip install -r requirements.txt --break-system-packages
          python -m pytest tests/ -v --tb=short 2>/dev/null || echo "No tests yet — linting only"
          python -m py_compile main.py && echo "Syntax OK"

# ─────────────────────────────────────────────
# 4. SECURITY SCAN (Trivy & Dep Audit)
# ─────────────────────────────────────────────
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0          # Don't fail pipeline on vulnerabilities for now
          format: table
      - name: Dependency audit — backend (yarn)
        run: cd backend && yarn audit --level high || true
      - name: Dependency audit — frontend (npm)
        run: cd frontend && npm audit --audit-level=high || true

# ─────────────────────────────────────────────
# 4.5. SAFETY VALIDATION GATE
# ─────────────────────────────────────────────
  safety-gate:
    name: Safety Validation Gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-ai-services]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: yarn, cache-dependency-path: backend/yarn.lock }
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}', cache: pip }
      - name: Install dependencies
        run: |
          cd backend && yarn install --frozen-lockfile
          cd ../ai-services/metacognition && pip install -r requirements.txt --break-system-packages
      - name: Run Metacognition Service and Safety Benchmarks
        run: |
          # Start service in the background
          cd ai-services/metacognition
          uvicorn main:app --host 0.0.0.0 --port 8003 &
          PID=$!
          
          # Wait for it to be ready
          echo "Waiting for Metacognition service to start..."
          timeout 30 bash -c 'until curl -s http://localhost:8003/health > /dev/null; do sleep 2; done' || (echo "Service failed to start" && kill $PID && exit 1)
          
          # Run the benchmarks
          cd ../../backend
          npm run metacognition-benchmark
          npm run safety-validation
          
          # Cleanup
          kill $PID

# ─────────────────────────────────────────────
# 5. BUILD & PUSH DOCKER IMAGES (main branch only)
# ─────────────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-ai-services, safety-gate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            context: backend
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - service: ai-triage
            dockerfile: ai-services/triage/Dockerfile
            context: ai-services/triage
          - service: ai-vlm
            dockerfile: ai-services/vlm-report/Dockerfile
            context: ai-services/vlm-report
          - service: ai-uncertainty
            dockerfile: ai-services/uncertainty/Dockerfile
            context: ai-services/uncertainty
          - service: ai-metacognition
            dockerfile: ai-services/metacognition/Dockerfile
            context: ai-services/metacognition
          - service: ai-federated
            dockerfile: ai-services/federated-learning/Dockerfile
            context: ai-services/federated-learning
          - service: ai-continuous
            dockerfile: ai-services/continuous-learning/Dockerfile
            context: ai-services/continuous-learning
          - service: ai-pathology
            dockerfile: ai-services/pathology/Dockerfile
            context: ai-services/pathology
          - service: ai-mammography
            dockerfile: ai-services/mammography/Dockerfile
            context: ai-services/mammography
          - service: ai-retinal
            dockerfile: ai-services/retinal/Dockerfile
            context: ai-services/retinal
    steps:
      - uses: actions/checkout@v4

      # Azure ACR (service principal secret)
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to Azure ACR
        run: az acr login --name sewaaiproductionacr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          BRANCH=$(echo ${{ github.ref_name }} | sed 's/\//-/g')
          echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "latest=${BRANCH}-latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            sewaaiproductionacr.azurecr.io/sewa-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            sewaaiproductionacr.azurecr.io/sewa-${{ matrix.service }}:${{ steps.tag.outputs.latest }}
          cache-from: type=registry,ref=sewaaiproductionacr.azurecr.io/sewa-${{ matrix.service }}:cache
          cache-to:   type=registry,ref=sewaaiproductionacr.azurecr.io/sewa-${{ matrix.service }}:cache,mode=max

# ─────────────────────────────────────────────
# 6. DEPLOY — STAGING
# ─────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging (AKS)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
      url: https://app.sewaxai.health
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install kubelogin (for AAD-enabled clusters)
        run: |
          az aks install-cli
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: sewa-ai-staging-rg
          cluster-name:   sewa-ai-staging-aks
      - name: Deploy to AKS
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          kubectl set image deployment/sewa-backend   sewa-backend=sewaaiproductionacr.azurecr.io/sewa-backend:staging-${SHORT_SHA}   -n sewa-ai
          kubectl set image deployment/sewa-frontend  sewa-frontend=sewaaiproductionacr.azurecr.io/sewa-frontend:staging-${SHORT_SHA}  -n sewa-ai
          kubectl set image deployment/sewa-ai-triage sewa-ai-triage=sewaaiproductionacr.azurecr.io/sewa-ai-triage:staging-${SHORT_SHA} -n sewa-ai
          kubectl set image deployment/sewa-ai-vlm    sewa-ai-vlm=sewaaiproductionacr.azurecr.io/sewa-ai-vlm:staging-${SHORT_SHA}      -n sewa-ai
          kubectl rollout status deployment/sewa-backend -n sewa-ai --timeout=300s
      - name: Run smoke tests
        run: |
          sleep 15
          curl -f https://api.sewaxai.health/health || exit 1

# ─────────────────────────────────────────────
# 7. DEPLOY — PRODUCTION (Azure AKS) — manual gate
# ─────────────────────────────────────────────
  deploy-azure-prod:
    name: Deploy to Production (Azure AKS)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production-azure
      url: https://app.sewaxai.health
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install kubelogin (for AAD-enabled clusters)
        run: |
          az aks install-cli
      - uses: azure/aks-set-context@v3
        with:
          resource-group: sewa-ai-production-rg
          cluster-name:   sewa-ai-production-aks
      - name: Rolling deploy — all services
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          TAG="main-${SHORT_SHA}"
          SERVICES="backend frontend ai-triage ai-vlm ai-uncertainty ai-metacognition ai-federated ai-continuous ai-pathology ai-mammography ai-retinal"
          for svc in $SERVICES; do
            kubectl set image deployment/sewa-${svc} sewa-${svc}=sewaaiproductionacr.azurecr.io/sewa-${svc}:${TAG} -n sewa-ai
          done
          kubectl rollout status deployment/sewa-backend   -n sewa-ai --timeout=600s
          kubectl rollout status deployment/sewa-frontend  -n sewa-ai --timeout=300s
      - name: Production health check
        run: |
          sleep 30
          curl -f https://api.sewaxai.health/health
          curl -f https://api.sewaxai.health/v1/ai/health
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            { "text": "✅ SEWA AI deployed to production — ${{ github.sha }} by ${{ github.actor }}" }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# ─────────────────────────────────────────────
# 8. DEPLOY — PRODUCTION (AWS EKS)
# ─────────────────────────────────────────────
  deploy-aws-prod:
    name: Deploy to Production (AWS EKS)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-aws
      url: https://us.sewaxai.health
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          aws-region:        us-east-1
          role-session-name: sewa-deploy-${{ github.run_id }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push to ECR
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          SERVICES="backend frontend ai-triage ai-vlm ai-uncertainty ai-metacognition"
          for svc in $SERVICES; do
            docker pull sewaaiproductionacr.azurecr.io/sewa-${svc}:main-${SHORT_SHA}
            docker tag  sewaaiproductionacr.azurecr.io/sewa-${svc}:main-${SHORT_SHA} \
                        ${{ steps.ecr-login.outputs.registry }}/sewa-${svc}:main-${SHORT_SHA}
            docker push ${{ steps.ecr-login.outputs.registry }}/sewa-${svc}:main-${SHORT_SHA}
          done
      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name sewa-ai-prod-eks --region us-east-1
      - name: Rolling deploy to EKS
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          ECR=${{ steps.ecr-login.outputs.registry }}
          kubectl set image deployment/sewa-backend  sewa-backend=${ECR}/sewa-backend:main-${SHORT_SHA}  -n sewa-ai
          kubectl set image deployment/sewa-frontend sewa-frontend=${ECR}/sewa-frontend:main-${SHORT_SHA} -n sewa-ai
          kubectl rollout status deployment/sewa-backend -n sewa-ai --timeout=600s

# ─────────────────────────────────────────────
# 9. DEPLOY — PRODUCTION (GCP GKE)
# ─────────────────────────────────────────────
  deploy-gcp-prod:
    name: Deploy to Production (GCP GKE)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-gcp
      url: https://eu.sewaxai.health
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:             ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev
      - name: Tag and push to GCR
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          SERVICES="backend frontend ai-triage ai-vlm ai-uncertainty ai-metacognition"
          for svc in $SERVICES; do
            docker pull sewaaiproductionacr.azurecr.io/sewa-${svc}:main-${SHORT_SHA}
            docker tag  sewaaiproductionacr.azurecr.io/sewa-${svc}:main-${SHORT_SHA} \
                        europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sewa/sewa-${svc}:main-${SHORT_SHA}
            docker push europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sewa/sewa-${svc}:main-${SHORT_SHA}
          done
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sewa-ai-prod-gke
          location:     europe-west2
      - name: Rolling deploy to GKE
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c8)
          GAR=europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sewa
          kubectl set image deployment/sewa-backend  sewa-backend=${GAR}/sewa-backend:main-${SHORT_SHA}  -n sewa-ai
          kubectl set image deployment/sewa-frontend sewa-frontend=${GAR}/sewa-frontend:main-${SHORT_SHA} -n sewa-ai
          kubectl rollout status deployment/sewa-backend -n sewa-ai --timeout=600s

# ─────────────────────────────────────────────
# 10. DB MIGRATIONS (runs after all deploys)
# ─────────────────────────────────────────────
  run-migrations:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [deploy-azure-prod]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install kubelogin (for AAD-enabled clusters)
        run: |
          az aks install-cli
      - uses: azure/aks-set-context@v3
        with:
          resource-group: sewa-ai-production-rg
          cluster-name:   sewa-ai-production-aks
      - name: Run Prisma migrate deploy
        run: |
          kubectl exec -n sewa-ai deploy/sewa-backend -- \
            npx prisma migrate deploy
