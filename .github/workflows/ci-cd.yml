name: SEWA AI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  ACR_NAME: sewaaieuprodacr
  ACR_LOGIN_SERVER: sewaaieuprodacr.azurecr.io
  AZURE_SUBSCRIPTION: a14702a0-439b-42f5-b31a-8b898adfa965

jobs:
  # ── Backend Checks ──
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npx eslint src/ --max-warnings 0
        working-directory: backend

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sewa_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/sewa_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm test -- --passWithNoTests
        working-directory: backend

  # ── Frontend Checks ──
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint src/ --max-warnings 300
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Container Builds (main only) ──
  build-backend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
      - run: |
          az acr login --name ${{ env.ACR_NAME }}
          ACR_TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --query accessToken -o tsv)
          echo "ACR_TOKEN set"
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/sewa-backend:${{ github.sha }} -f Dockerfile.backend .
          docker push ${{ env.ACR_LOGIN_SERVER }}/sewa-backend:${{ github.sha }}

  build-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
      - run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/sewa-frontend:${{ github.sha }} -f Dockerfile.frontend .
          docker push ${{ env.ACR_LOGIN_SERVER }}/sewa-frontend:${{ github.sha }}

  # ── Deploy to AKS (main only, manual gate) ──
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
      - run: az aks get-credentials --resource-group sewa-rg --name sewa-aks --overwrite-existing
      - run: |
          kubectl set image deployment/sewa-backend sewa-backend=${{ env.ACR_LOGIN_SERVER }}/sewa-backend:${{ github.sha }} -n sewa-ai
          kubectl set image deployment/sewa-frontend sewa-frontend=${{ env.ACR_LOGIN_SERVER }}/sewa-frontend:${{ github.sha }} -n sewa-ai
          kubectl set image deployment/sewa-triage triage=${{ env.ACR_LOGIN_SERVER }}/sewa-ai-triage:${{ github.sha }} -n sewa-ai
          kubectl rollout status deployment/sewa-backend -n sewa-ai --timeout=300s
          kubectl rollout status deployment/sewa-frontend -n sewa-ai --timeout=300s

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
      - run: az aks get-credentials --resource-group sewa-ai-prod-rg --name sewa-ai-prod-eu-aks --overwrite-existing
      - run: |
          kubectl set image deployment/sewa-backend sewa-backend=${{ env.ACR_LOGIN_SERVER }}/sewa-backend:${{ github.sha }} -n sewa-ai
          kubectl set image deployment/sewa-frontend sewa-frontend=${{ env.ACR_LOGIN_SERVER }}/sewa-frontend:${{ github.sha }} -n sewa-ai
          kubectl rollout status deployment/sewa-backend -n sewa-ai --timeout=600s
          kubectl rollout status deployment/sewa-frontend -n sewa-ai --timeout=600s
