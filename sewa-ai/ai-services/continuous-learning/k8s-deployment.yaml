apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-continuous-learning
  namespace: sewa-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-continuous-learning
  template:
    metadata:
      labels:
        app: sewa-continuous-learning
    spec:
      containers:
      - name: continuous-learning
        image: sewaaiproductionacr.azurecr.io/sewa-continuous-learning:industrialized-20260421
        ports:
        - containerPort: 8005
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-continuous-learning
  namespace: sewa-ai
spec:
  selector:
    app: sewa-continuous-learning
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8005
