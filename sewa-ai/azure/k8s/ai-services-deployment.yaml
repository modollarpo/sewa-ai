# ── Federated Learning Service ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-federated
  namespace: sewa-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-federated
  template:
    metadata:
      labels:
        app: sewa-federated
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: federated
        image: "{{CONTAINER_REGISTRY}}/sewa-ai-federated-learning:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        envFrom:
        - secretRef:
            name: sewa-secrets
        resources:
          limits:
            memory: "4Gi"
          requests:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-federated
  namespace: sewa-ai
spec:
  selector:
    app: sewa-federated
  ports:
  - port: 8004
    targetPort: 8004
---
# ── Continuous Learning Service ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-continuous
  namespace: sewa-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sewa-continuous
  template:
    metadata:
      labels:
        app: sewa-continuous
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: continuous
        image: "{{CONTAINER_REGISTRY}}/sewa-ai-continuous-learning:{{IMAGE_TAG}}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        envFrom:
        - secretRef:
            name: sewa-secrets
        - configMapRef:
            name: sewa-config
        resources:
          limits:
            memory: "4Gi"
          requests:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-continuous
  namespace: sewa-ai
spec:
  selector:
    app: sewa-continuous
  ports:
  - port: 8005
    targetPort: 8005
