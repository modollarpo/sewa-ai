apiVersion: apps/v1
kind: Deployment
metadata:
  name: sewa-triage
  namespace: sewa-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sewa-triage
  template:
    metadata:
      labels:
        app: sewa-triage
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: true
        effect: NoSchedule
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: triage
        image: "{{CONTAINER_REGISTRY}}/sewa-triage:{{IMAGE_TAG}}"
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 6Gi
          requests:
            memory: 2Gi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sewa-triage
  namespace: sewa-ai
spec:
  selector:
    app: sewa-triage
  ports:
  - port: 8000
    targetPort: 8000
---
